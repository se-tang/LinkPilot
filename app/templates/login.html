<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>登录 · LinkPilot</title>
<link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='logo.svg') }}"/>
<link rel="stylesheet" href="{{ url_for('static', filename='login.css') }}?v={{ version }}-v2"/>
</head>
<body data-theme="light">
<header class="login-header">
  <span class="login-brand">
    <img src="{{ url_for('static', filename='logo.svg') }}" width="34" height="24" alt="LinkPilot"/>
    <span>LinkPilot <small>线路测试面板</small></span>
  </span>
  <button type="button" class="login-theme-btn" id="loginThemeBtn" aria-label="切换浅色或深色模式">
    <svg class="moon-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M20.4 14.2A8.4 8.4 0 0 1 9.8 3.6 8.5 8.5 0 1 0 20.4 14.2Z"/>
    </svg>
    <svg class="sun-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="12" cy="12" r="3.6"/>
      <path d="M12 2.2v2M12 19.8v2M4.1 4.1l1.4 1.4M18.5 18.5l1.4 1.4M2.2 12h2M19.8 12h2M4.1 19.9l1.4-1.4M18.5 5.5l1.4-1.4"/>
    </svg>
    <span id="loginThemeLabel">深色</span>
  </button>
</header>

<main class="login-stage">
  <section class="login-hero">
    <div class="hero-kicker">MULTI-NODE NETWORK TELEMETRY</div>
    <h1>洞察每一条 <span>跨区链路</span> 的真实表现。</h1>
    <p>集中编排全球多台后端与目标节点，执行并发吞吐压测、常驻延迟监测与跨轮趋势对比，让跨境与多线网络状态一目了然。</p>

    <div class="hero-telemetry" aria-hidden="true">
      <div class="telemetry-top">
        <span>GLOBAL PATH MONITOR</span>
        <span class="telemetry-pill"><i></i>LIVE STREAM</span>
      </div>
      <svg viewBox="0 0 420 100" preserveAspectRatio="none" fill="none">
        <defs>
          <linearGradient id="loginWaveFill" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="currentColor" stop-opacity="0.28"/>
            <stop offset="100%" stop-color="currentColor" stop-opacity="0"/>
          </linearGradient>
        </defs>
        <path class="wave-grid" d="M0 24H420M0 52H420M0 80H420"/>
        <path class="wave-area" d="M0 72C28 72 42 54 68 54S108 62 136 46S176 50 206 32S248 40 278 24S322 30 352 16S390 22 420 14L420 100L0 100Z" fill="url(#loginWaveFill)"/>
        <path class="wave-line" d="M0 72C28 72 42 54 68 54S108 62 136 46S176 50 206 32S248 40 278 24S322 30 352 16S390 22 420 14"/>
      </svg>
      <div class="telemetry-metrics">
        <div><small>多节点探测</small><b>Global Map</b></div>
        <div><small>吞吐 / 丢包 / 抖动</small><b>iperf3 + Ping</b></div>
        <div><small>自动周期追踪</small><b>长期趋势</b></div>
      </div>
    </div>
  </section>

  <section class="login-card" aria-labelledby="loginTitle">
    <div class="card-badge"><span aria-hidden="true"></span> 控制台认证</div>
    <h2 id="loginTitle">欢迎回来，登录工作台</h2>
    <p>输入管理员账号与密码以管理节点及测试任务。</p>
    <form id="loginForm" novalidate>
      <div id="msg" class="msg hide" role="alert" aria-live="polite"></div>
      <label>用户名
        <input id="user" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="请输入管理员用户名"/>
      </label>
      <label>密码
        <span class="input-wrap">
          <input id="password" type="password" autocomplete="current-password" placeholder="请输入密码"/>
          <button class="eye" id="togglePassword" type="button" aria-label="显示密码">显示</button>
        </span>
      </label>
      <button class="submit" id="loginBtn" type="submit">登录控制台</button>
      <div class="help"><button id="forgot" type="button">忘记密码？</button></div>
    </form>
  </section>
</main>

<footer class="login-footer">
  <span>LinkPilot · 多机线路测试与监控面板</span>
  <span>v{{ version }}</span>
</footer>

<script nonce="{{ csp_nonce }}">
const form = document.getElementById('loginForm');
const userInput = document.getElementById('user');
const passwordInput = document.getElementById('password');
const loginBtn = document.getElementById('loginBtn');
const message = document.getElementById('msg');
const togglePassword = document.getElementById('togglePassword');
const themeBtn = document.getElementById('loginThemeBtn');
const themeLabel = document.getElementById('loginThemeLabel');

function applyLoginTheme(theme) {
  const next = theme === 'dark' ? 'dark' : 'light';
  document.body.dataset.theme = next;
  if (themeLabel) themeLabel.textContent = next === 'dark' ? '浅色' : '深色';
  try { localStorage.setItem('fleet-theme', next); } catch (e) {}
}
try {
  const saved = localStorage.getItem('fleet-theme');
  applyLoginTheme(saved || (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
} catch (e) {}
if (themeBtn) {
  themeBtn.addEventListener('click', () => {
    applyLoginTheme(document.body.dataset.theme === 'dark' ? 'light' : 'dark');
  });
}

function setMessage(text, ok = false) {
  message.textContent = text;
  message.className = 'msg' + (ok ? ' ok' : '');
}

togglePassword.addEventListener('click', () => {
  const show = passwordInput.type === 'password';
  passwordInput.type = show ? 'text' : 'password';
  togglePassword.textContent = show ? '隐藏' : '显示';
  togglePassword.setAttribute('aria-label', show ? '隐藏密码' : '显示密码');
});

document.getElementById('forgot').addEventListener('click', () => {
  setMessage('请联系面板管理员，在服务器上重置登录密码。');
});

form.addEventListener('submit', async (event) => {
  event.preventDefault();
  message.className = 'msg hide';
  const user = userInput.value.trim();
  const password = passwordInput.value;
  if (!user) {
    setMessage('请输入用户名。');
    userInput.focus();
    return;
  }
  if (!password) {
    setMessage('请输入密码。');
    passwordInput.focus();
    return;
  }

  loginBtn.disabled = true;
  loginBtn.textContent = '登录中…';
  try {
    const response = await fetch('/api/login', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({user, password}),
    });
    const data = await response.json().catch(() => ({}));
    if (response.ok) {
      setMessage('登录成功，正在进入面板…', true);
      location.href = '/';
      return;
    }
    setMessage(data.error || '用户名或密码不正确，请检查后重试。');
  } catch (error) {
    setMessage('网络错误：' + error.message);
  }
  loginBtn.disabled = false;
  loginBtn.textContent = '登录控制台';
});
</script>
</body>
</html>
